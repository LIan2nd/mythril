name: mythril

services:
  db:
    image: postgres:16
    container_name: mythril-db
    profiles: [local-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mythril}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mythril}
      POSTGRES_DB: ${POSTGRES_DB:-mythril}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mythril-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./web
      args:
        NEXT_TELEMETRY_DISABLED: "1"
    container_name: mythril-web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:${APP_PORT:-7111}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  mythril-pgdata:
